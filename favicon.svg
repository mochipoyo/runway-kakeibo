  <g stroke="#1D6A84" stroke-width="1.6" stroke-linecap="round">
    <line x1="21" y1="47" x2="29" y2="47"/>
    <line x1="21" y1="51" x2="27" y2="51"/>
    <line x1="21" y1="55" x2="29" y2="55"/>
    <line x1="35" y1="47" x2="43" y2="47"/>
    <line x1="35" y1="51" x2="41" y2="51"/>
